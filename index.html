<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Писькасейлс</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Inter:wght@400;500;600&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Фоновая вращающаяся Земля - чисто декоративная, за контентом -->
  <div class="earth-bg" aria-hidden="true">
    <svg viewBox="0 0 200 200" class="earth-svg">
      <defs>
        <clipPath id="globeClip">
          <circle cx="100" cy="100" r="90" />
        </clipPath>
      </defs>
      <circle cx="100" cy="100" r="90" class="earth-fill" />
      <g clip-path="url(#globeClip)" class="earth-spin">
        <!-- меридианы (линии долготы) -->
        <ellipse cx="100" cy="100" rx="90" ry="90" class="earth-grid" />
        <ellipse cx="100" cy="100" rx="55" ry="90" class="earth-grid" />
        <ellipse cx="100" cy="100" rx="20" ry="90" class="earth-grid" />
        <line x1="100" y1="10" x2="100" y2="190" class="earth-grid" />
        <!-- параллели (линии широты) -->
        <line x1="10" y1="45" x2="190" y2="45" class="earth-grid" />
        <line x1="10" y1="100" x2="190" y2="100" class="earth-grid earth-equator" />
        <line x1="10" y1="155" x2="190" y2="155" class="earth-grid" />
      </g>
      <circle cx="100" cy="100" r="90" class="earth-outline" />
    </svg>
  </div>

  <header class="app-header">
    <div class="currency-selector">
      <button
        type="button"
        id="currency-btn"
        class="currency-btn"
        aria-haspopup="listbox"
        aria-expanded="false"
        aria-controls="currency-dropdown"
      >
        <span id="currency-btn-label">₴ UAH</span>
        <span class="currency-caret" aria-hidden="true">▾</span>
      </button>
      <ul class="currency-dropdown hidden" id="currency-dropdown" role="listbox" aria-label="Выбор валюты">
        <li role="option" tabindex="0" data-currency="uah" data-symbol="₴" aria-selected="true">₴ UAH — гривна</li>
        <li role="option" tabindex="0" data-currency="rub" data-symbol="₽" aria-selected="false">₽ RUB — рубль</li>
        <li role="option" tabindex="0" data-currency="usd" data-symbol="$" aria-selected="false">$ USD — доллар</li>
        <li role="option" tabindex="0" data-currency="eur" data-symbol="€" aria-selected="false">€ EUR — евро</li>
      </ul>
    </div>
    <h1>Писькасейлс</h1>
  </header>

  <main id="app">
    <!-- Экран поиска -->
    <section id="screen-search" class="screen active">
      <form id="search-form">
        <div class="field-row">
          <div class="field autocomplete-field">
            <label for="origin">Откуда</label>
            <input type="text" id="origin" placeholder="Город вылета" autocomplete="off" required
              role="combobox" aria-expanded="false" aria-autocomplete="list" aria-controls="origin-suggestions" />
            <span class="field-flag" id="origin-flag" aria-hidden="true"></span>
            <ul class="suggestions hidden" id="origin-suggestions" role="listbox" aria-label="Варианты городов вылета"></ul>
          </div>
          <button type="button" id="swap-btn" class="swap-btn" title="Поменять местами" aria-label="Поменять города местами">⇄</button>
          <div class="field autocomplete-field">
            <label for="destination">Куда</label>
            <input type="text" id="destination" placeholder="Город назначения" autocomplete="off" required
              role="combobox" aria-expanded="false" aria-autocomplete="list" aria-controls="destination-suggestions" />
            <span class="field-flag" id="destination-flag" aria-hidden="true"></span>
            <ul class="suggestions hidden" id="destination-suggestions" role="listbox" aria-label="Варианты городов назначения"></ul>
          </div>
        </div>

        <div class="field">
          <label for="departure-date">Дата вылета</label>
          <input type="date" id="departure-date" required />
        </div>

        <div class="field checkbox-field">
          <input type="checkbox" id="flexible-dates" />
          <label for="flexible-dates">Гибкие даты (±3 дня)</label>
        </div>

        <details class="filters-block">
          <summary>Фильтры</summary>

          <div class="field checkbox-field">
            <input type="checkbox" id="direct-only" />
            <label for="direct-only">Только прямые рейсы</label>
          </div>

          <div class="field autocomplete-field">
            <label for="airline-filter">Авиакомпания (необязательно)</label>
            <input type="text" id="airline-filter" placeholder="напр. Qatar Airways" autocomplete="off"
              role="combobox" aria-expanded="false" aria-autocomplete="list" aria-controls="airline-suggestions" />
            <ul class="suggestions hidden" id="airline-suggestions" role="listbox" aria-label="Варианты авиакомпаний"></ul>
          </div>

          <div class="field">
            <label for="sort-order">Сортировка</label>
            <select id="sort-order">
              <option value="price">Сначала дешёвые</option>
              <option value="date">По дате вылета</option>
            </select>
          </div>

          <div class="field">
            <label id="passengers-label">Пассажиры (взрослые)</label>
            <div class="stepper" role="group" aria-labelledby="passengers-label">
              <button type="button" class="stepper-btn" id="passengers-decrement" aria-label="Уменьшить количество пассажиров">−</button>
              <input type="number" id="passengers" min="1" max="9" value="1" readonly inputmode="numeric" aria-live="polite" />
              <button type="button" class="stepper-btn" id="passengers-increment" aria-label="Увеличить количество пассажиров">+</button>
            </div>
          </div>

          <div class="field">
            <label for="cabin-class">Класс кабины</label>
            <select id="cabin-class">
              <option value="1">Эконом</option>
              <option value="2">Бизнес</option>
              <option value="3">Первый</option>
              <option value="5">Премиум-эконом</option>
            </select>
          </div>

          <div class="field">
            <label for="trip-type">Тип рейса</label>
            <select id="trip-type">
              <option value="1">В одну сторону</option>
              <option value="2">Туда-обратно</option>
            </select>
          </div>

          <div class="field hidden" id="return-date-field">
            <label for="return-date">Дата обратно</label>
            <input type="date" id="return-date" />
          </div>
        </details>

        <button type="submit" id="search-btn" class="primary-btn">Найти билеты</button>
      </form>
    </section>

    <!-- Экран загрузки -->
    <section id="screen-loading" class="screen" aria-live="polite">
      <div class="plane-loader" aria-hidden="true">
        <svg viewBox="0 0 220 60" class="plane-loader-svg">
          <path
            d="M10 45 Q110 -10 210 45"
            class="plane-path"
            fill="none"
          />
          <g class="plane-icon">
            <path
              d="M0 0 L14 4 L0 8 L3 4 Z"
              fill="var(--accent)"
              transform="translate(-3,-4)"
            />
          </g>
        </svg>
      </div>
      <p>Ищем лучшие цены…</p>
    </section>

    <!-- Экран ошибки -->
    <section id="screen-error" class="screen">
      <p id="error-message" role="alert">Что-то пошло не так.</p>
      <div id="error-actions"></div>
    </section>

    <!-- Экран результатов -->
    <section id="screen-results" class="screen">
      <div class="results-header">
        <button type="button" id="back-btn" class="text-btn">← Новый поиск</button>
        <span id="results-count" aria-live="polite"></span>
      </div>
      <ul id="results-list"></ul>
      <div id="results-empty" class="hidden empty-state">
        <p class="empty-state-text">Билетов нема.</p>
